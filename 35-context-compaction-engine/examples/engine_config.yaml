# Фрагмент config.yaml: включаем движок и задаём его параметры.
# Ключи движка читаются из секции compression (иначе берутся значения по умолчанию).

context:
  engine: autocompact        # хост берёт движок по имени; без строки — встроенное сжатие

compression:
  threshold_tokens: 250000            # предохранитель: у стенки сжимаем обязательно
  autocompact_preflight_ratio: 0.6    # упреждающий хук: сжатие на границе задачи
  autocompact_target_ratio: 0.45      # во что целимся после сжатия
  autocompact_tail_tokens: 25000      # хвост свежей работы, остаётся дословно
